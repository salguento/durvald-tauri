<!doctype html>
<html>
    <head>
        <style>
            @font-face {
                font-family: "AdwaitaSans";
                src: url("/src/assets/fonts/AdwaitaSans-Regular.ttf")
                    format("truetype");
                font-weight: medium;
                font-style: medium;
            }
            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: linear-gradient(
                    135deg,
                    oklch(14.1% 0.005 285.823) 0%,
                    oklch(14.1% 0.005 285.823) 100%
                );
                font-family:
                    "AdwaitaSans",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
            }

            .loading-container {
                text-align: center;
                color: oklch(92% 0.004 286.32);
            }

            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                border-top: 4px solid oklch(92% 0.004 286.32);
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .logo {
                font-size: 24px;
                font-weight: bold;
                margin-bottom: 10px;
            }

            .subtitle {
                opacity: 0.8;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="loading-container">
            <div class="spinner"></div>
            <img src="./assets/images/logotype.svg" style="height: 32px" />
        </div>
    </body>
</html>
